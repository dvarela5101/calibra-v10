<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#FFFDF5;color:#0B1B33;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;">
    <p style="margin:0 0 16px;font-size:22px;font-weight:700;color:#005EFF;">Calibra</p>
    <h1 style="margin:0 0 12px;font-size:22px;">Confirma tu correo</h1>
    <p style="margin:0 0 20px;">Pediste crear tu cuenta de Calibra con este correo. Confirma que es tuyo con este enlace:</p>
    <p style="margin:0 0 20px;">
      <a href="{{ .SiteURL }}/cuenta/confirmar?token_hash={{ .TokenHash }}&type=email_change"
         style="display:inline-block;padding:14px 20px;background:#005EFF;color:#ffffff;border-radius:14px;font-weight:600;text-decoration:none;">Confirmar mi correo</a>
    </p>
    <p style="margin:0;color:#636F81;font-size:14px;">El enlace sirve una sola vez y vence en una hora. Si no lo pediste, ignora este correo: no se crea ninguna cuenta.</p>
  </body>
</html>
